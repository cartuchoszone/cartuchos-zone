[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/roms/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/cores/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/emulatorjs/data/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/api/rom/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/games/roms/snes/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# Roteia chamadas de ROMs diretamente para os arquivos estáticos de alta velocidade
[[redirects]]
  from = "/api/rom/:id"
  to = "/roms/:id.smc"
  status = 200
  force = false

[[redirects]]
  from = "/games/roms/snes/:id.smc"
  to = "/roms/:id.smc"
  status = 200
  force = false

[[redirects]]
  from = "/games/roms/snes/:id.sfc"
  to = "/roms/:id.smc"
  status = 200
  force = false

[[redirects]]
  from = "/games/roms/snes/:id"
  to = "/roms/:id.smc"
  status = 200
  force = false
