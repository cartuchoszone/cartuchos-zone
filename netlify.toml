[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Cache persistente para ROMs no Edge CDN da Netlify
[[headers]]
  for = "/api/rom/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
    Access-Control-Allow-Origin = "*"

# Proxy direto no Edge CDN da Netlify para as ROMs de Super Nintendo
[[redirects]]
  from = "/api/rom/:id"
  to = "https://classicgamezone.com/games/roms/snes/:id.smc"
  status = 200
  force = true
  headers = { Access-Control-Allow-Origin = "*", Access-Control-Allow-Methods = "GET, HEAD, OPTIONS", Cache-Control = "public, max-age=604800, stale-while-revalidate=86400" }
