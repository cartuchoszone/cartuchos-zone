[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/emulatorjs/data/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/api/rom/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/games/roms/snes/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# Roteia chamadas legadas de ROMs diretamente para a rota segura com proxy e cache
[[redirects]]
  from = "/games/roms/snes/:id.smc"
  to = "/api/rom/:id"
  status = 200
  force = true

[[redirects]]
  from = "/games/roms/snes/:id.sfc"
  to = "/api/rom/:id"
  status = 200
  force = true

[[redirects]]
  from = "/games/roms/snes/:id"
  to = "/api/rom/:id"
  status = 200
  force = true
